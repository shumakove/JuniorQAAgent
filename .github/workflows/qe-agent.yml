name: QE Agent

on:
  workflow_dispatch:
  pull_request:

jobs:
  qe-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run agent evaluation
        run: |
          python -m pytest tests/test_evaluation.py -vv -s